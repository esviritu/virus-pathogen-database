name: Taxonomy change
description: A name or lineage that is wrong, or has changed at NCBI or ICTV.
title: "Taxonomy: "
labels: ["taxonomy"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in what you can. You do not need to open a pull request: a maintainer will reply here, and they or someone working with them will make the change.
  - type: textarea
    id: affected-records
    attributes:
      label: Affected records
      description: 'An accession, or a rule such as "every record with genus = X".'
      render: text
    validations:
      required: true
  - type: dropdown
    id: rank
    attributes:
      label: Rank
      options:
        - "subspecies or strain"
        - "species"
        - "genus"
        - "family or higher"
    validations:
      required: true
  - type: input
    id: current-name
    attributes:
      label: Current name in VPD
    validations:
      required: true
  - type: input
    id: proposed-name
    attributes:
      label: Proposed name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: The NCBI Taxonomy ID, the ICTV release, or both, that support the proposed name.
    validations:
      required: true
  - type: dropdown
    id: ncbi-change
    attributes:
      label: Is this an NCBI change?
      options:
        - "Yes: NCBI renamed or moved this taxon"
        - "No: VPD's entry was wrong when it was built"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: downstream-impact
    attributes:
      label: Downstream impact
      description: Optional. Names people search for that will change. SARS-CoV-2, for example, is "Betacoronavirus pandemicum".
